name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Capacitor
        run: pnpm add @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app (app mode)
        run: pnpm run build:app

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Enable safe area layout
        run: |
          mkdir -p android/app/src/main/java/net/pokerogue/app
          cat > android/app/src/main/java/net/pokerogue/app/MainActivity.java << 'EOF'
          package net.pokerogue.app;

          import android.graphics.Color;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().setBackgroundColor(Color.RED);
            }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
